# Installed as /etc/systemd/system/linux-panel.service.d/90-update-recovery-guard.conf
# OR conditions: start if there is NO outstanding root transaction, or when
# a live, privileged Broker has temporarily approved the panel restart.
# No additional privilege is granted to the non-root Web service.
[Unit]
ConditionPathExists=|!/var/lib/linux-panel-update-root/active-transaction
ConditionPathExists=|/run/linux-panel-root-updater/allow-panel-start

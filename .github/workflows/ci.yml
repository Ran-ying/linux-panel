name: Linux Panel CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate deploy script syntax
        run: |
          # IMPORTANT: `bash -n a.sh b.sh` only parses a.sh; the rest are arguments.
          # Always syntax-check EACH script independently, including updater scripts.
          for script in scripts/*.sh; do
            echo "Bash syntax: $script"
            bash -n "$script"
          done
          bash scripts/prepare-host.sh --help
          bash scripts/prepare-host.sh --check
          bash scripts/prepare-host.sh --install-node
          bash scripts/install.sh --help
          bash scripts/install-update-broker.sh --help
          bash scripts/install.sh --preflight --host 127.0.0.1 --port 49117
      - name: Install dependencies
        run: npm ci
      - name: Install MCP optional extension dependencies
        run: npm install --prefix extensions/mcp --omit=dev --no-audit --no-fund
      - name: Audit optional extension dependencies
        run: npm audit --prefix extensions/mcp --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run unit and API integration tests
        run: npm test
      - name: Disposable root executor acceptance
        run: sudo env PANEL_ROOT_ACCEPTANCE=1 "$(command -v node)" --test tests/privileged-root.test.js
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build production Vue frontend
        run: npm run build:web

      - name: Install isolated browser test tools
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser responsive and PWA acceptance
        env:
          PANEL_BROWSER_OUTPUT: ${{ runner.temp }}/panel-browser-screenshots
        run: node tests/browser/acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-browser-screenshots
          path: ${{ runner.temp }}/panel-browser-screenshots
          if-no-files-found: ignore

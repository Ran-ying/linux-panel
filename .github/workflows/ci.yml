name: Linux Panel CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate deploy script syntax
        run: |
          bash -n scripts/install.sh scripts/install-preflight.sh scripts/update.sh scripts/install-update-broker.sh scripts/update-worker.sh
          bash scripts/install.sh --help
          bash scripts/install.sh --preflight --domain ci.example.invalid --no-nginx
      - name: Install dependencies
        run: npm ci
      - name: Install MCP optional extension dependencies
        run: npm install --prefix extensions/mcp --omit=dev --no-audit --no-fund
      - name: Audit optional extension dependencies
        run: npm audit --prefix extensions/mcp --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run unit and API integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build production Vue frontend
        run: npm run build:web

name: Publish owner-approved v0.5
on:
  push:
    branches: [main]
    paths: ['docs/RELEASE-V0.5.md', '.github/workflows/release-draft.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --prefix extensions/mcp --omit=dev --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm audit --prefix extensions/mcp --omit=dev
      - run: npm test
      - run: npm run check
      - run: npm run build:web
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish only the existing owner-approved release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="repos/$GITHUB_REPOSITORY/releases/413997645"
          gh api "$release" > /tmp/panel-release-current.json
          test "$(jq -r .tag_name /tmp/panel-release-current.json)" = v0.5.0
          if test "$(jq -r .draft /tmp/panel-release-current.json)" = false; then
            echo 'Release already published; preserving it without modification.'
            exit 0
          fi
          test "$(jq -r .target_commitish /tmp/panel-release-current.json)" = 651dd945da8c27371fcec8891acb313b680821af
          jq -n --arg body "$(cat docs/RELEASE-V0.5.md)" --arg sha "$GITHUB_SHA" \
            '{draft:false,prerelease:false,make_latest:"true",name:"Linux Panel v0.5.0",target_commitish:$sha,body:$body}' \
            > /tmp/panel-release-approved.json
          gh api --method PATCH "$release" --input /tmp/panel-release-approved.json \
            --jq '{url:.html_url,tag:.tag_name,draft:.draft,target:.target_commitish}'

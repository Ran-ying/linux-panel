name: Disposable fresh application install
on:
  pull_request:
    paths:
      - 'scripts/install*.sh'
      - 'scripts/setup.sh'
      - 'scripts/admin-init.js'
      - '.github/workflows/fresh-install.yml'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current PR on disposable runner, login and refuse replacement
        env:
          INSTALL_REF: ${{ github.head_ref }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          secret=$(mktemp)
          trap 'rm -f "$secret"' EXIT
          chmod 600 "$secret"
          openssl rand -hex 24 > "$secret"
          # The runner's Node toolcache is not root-owned; provide a root-owned
          # runtime specifically for the privileged service.
          sudo install -d -o root -g root -m 0755 /usr/lib/linux-panel-root-test-runtime
          sudo install -o root -g root -m 0755 "$(command -v node)" /usr/lib/linux-panel-root-test-runtime/node
          sudo bash scripts/setup.sh --apply --host 127.0.0.1 --port 49331 \
            --node-bin "$(command -v node)" --ref "$INSTALL_REF" \
            --enable-privileged --privileged-node-bin /usr/lib/linux-panel-root-test-runtime/node \
            --admin-password-stdin < "$secret"
          sudo systemctl is-active --quiet linux-panel.service
          sudo systemctl is-active --quiet linux-panel-privileged.service
          PANEL_TEST_PASSWORD_PATH="$secret" node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const origin='http://127.0.0.1:49331';
          let response;
          for(let i=0;i<30;i++){
            try {response=await fetch(origin+'/api/auth/status');if(response.ok)break;}catch{}
            await new Promise(r=>setTimeout(r,500));
          }
          assert.equal(response?.status,200);
          const login=await fetch(origin+'/api/auth/login',{method:'POST',headers:{
            origin,'content-type':'application/json','x-panel-client':'web'},
            body:JSON.stringify({username:'admin',password:readFileSync(process.env.PANEL_TEST_PASSWORD_PATH,'utf8').trim()})});
          assert.equal(login.status,200);
          console.log('PASS real fresh install, service and password login');
          JS
          if sudo bash scripts/setup.sh --apply --host 127.0.0.1 --port 49331 \
            --node-bin "$(command -v node)" --admin-password-stdin < "$secret"; then
            echo 'FAIL repeated install overwrote existing instance'; exit 1
          fi
          test ! -e /etc/systemd/system/linux-panel-update.service
          sudo test "$(sudo stat -c %a /etc/linux-panel/panel.env)" = 600
          # The guided installer enabled this privileged service directly; no second command.
          test "$(systemctl show -P User linux-panel.service)" = linuxpanel
          test "$(systemctl show -P User linux-panel-privileged.service)" = root
          sudo runuser -u linuxpanel -g linuxpanel -G linux-panel-privileged -- /usr/lib/linux-panel-root-test-runtime/node /opt/linux-panel/scripts/verify-privileged-executor.js
          PANEL_TEST_PASSWORD_PATH="$secret" node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {randomUUID} from 'node:crypto';
          import assert from 'node:assert/strict';
          const origin='http://127.0.0.1:49331';
          let ready;
          for(let i=0;i<30;i++){
            try{ready=await fetch(origin+'/api/auth/status');if(ready.ok)break;}catch{}
            await new Promise(resolve=>setTimeout(resolve,300));
          }
          const login=await fetch(origin+'/api/auth/login',{method:'POST',headers:{origin,'content-type':'application/json','x-panel-client':'web'},
            body:JSON.stringify({username:'admin',password:readFileSync(process.env.PANEL_TEST_PASSWORD_PATH,'utf8').trim()})});
          assert.equal(login.status,200);const credentials=await login.json(),cookie=login.headers.get('set-cookie').split(';')[0];
          const call=async(name,input)=>{
            const response=await fetch(origin+'/api/actions/files.'+name+'/execute',{method:'POST',headers:{origin,cookie,'content-type':'application/json','x-panel-csrf':credentials.csrf},body:JSON.stringify({input})});
            assert.equal(response.status,200,await response.clone().text());return (await response.json()).result;
          };
          for(const parent of ['/etc','/root']){
            const path=parent+'/.linux-panel-web-'+randomUUID();let created=false;
            try{
              await call('create',{path,type:'directory'});created=true;
              const file=path+'/file';await call('upload',{path:file,contentBase64:Buffer.from('web-root-fixture').toString('base64')});
              const original=await call('read',{path:file});await call('write',{path:file,content:'web-edited',revision:original.revision});
              await call('chown',{path:file,owner:'nobody',group:'nogroup'});await call('chmod',{path:file,mode:'0600'});
              const listing=await call('list',{path});assert.equal(listing.accessMode,'root');assert.equal(listing.entries[0].permissions,'0600');
              assert.equal(listing.entries[0].owner,'nobody:nogroup');assert.equal((await call('read',{path:file})).content,'web-edited');
            }finally{if(created)await call('delete',{path});}
          }
          console.log('PASS real linuxpanel Web -> installed root service, /etc and /root file operations');
          JS

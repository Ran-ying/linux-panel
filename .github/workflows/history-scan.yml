name: Full history credential scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Install pinned checksum-verified Gitleaks
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/panel-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/panel-gitleaks gitleaks
      - name: Scan all reachable history without printing secrets
        run: /tmp/panel-gitleaks/gitleaks git --redact --no-banner --log-opts=--all

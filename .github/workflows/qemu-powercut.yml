name: Disposable QEMU hard power-cut smoke

on:
  pull_request:
    paths:
      - "tests/staging/qemu-powercut-smoke.sh"
      - "tests/staging/qemu-guest-live-worker.sh"
      - ".github/workflows/qemu-powercut.yml"
      - "platform/state-store.js"
      - "scripts/update-worker.sh"
      - "platform/privileged/file-transfer.js"
      - "tests/file-transfer.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-guest-power-cut:
    name: "Isolated QEMU guest / ${{ matrix.scenario }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The original two-cut file-level smoke already passed in PR #44
        # (run 38662016872). It remains runnable through the same local
        # script with LP_QEMU_SCENARIO=file, but should not force a repeated
        # software-TCG guest reboot on every root-worker acceptance attempt.
        scenario: [broker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refuse shared/self-hosted runner and verify syntax
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          bash -n tests/staging/qemu-powercut-smoke.sh
          bash -n tests/staging/qemu-guest-live-worker.sh
      - name: Install ephemeral QEMU host tools
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils
      - name: Hard kill fresh isolated guest and verify scenario
        env:
          LP_QEMU_SCENARIO: ${{ matrix.scenario }}
        run: bash tests/staging/qemu-powercut-smoke.sh
